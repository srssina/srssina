      ─ xml                                                                                                                            
      <svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">                                          
        <!-- Background -->                                                                                                            
        <rect width="100%" height="100%" fill="#0d1117" />                                                                             
        <!-- Glowing Grid -->                                                                                                          
        <defs>                                                                                                                         
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">                                                     
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#16213e" stroke-width="0.5" />                                             
          </pattern>                                                                                                                   
          <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">                                                              
            <feGaussianBlur stdDeviation="4" result="blur" />                                                                          
            <feComposite in="SourceGraphic" in2="blur" operator="over" />                                                              
          </filter>                                                                                                                    
        </defs>                                                                                                                        
        <rect width="100%" height="100%" fill="url(#grid)" />                                                                          
        <!-- Animated Title -->                                                                                                        
        <text x="400" y="80" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#00f5ff" text-anchor="middle"     
      filter="url(#glow)">                                                                                                             
          <animate attributeName="opacity" values="0;1" dur="1.5s" fill="freeze" />                                                    
          Sina Rahimian                                                                                                                
          <animate attributeName="fill" values="#00f5ff;#ff00e6;#00f5ff" dur="3s" repeatCount="indefinite" />                          
        </text>                                                                                                                        
        <!-- Pulsing Tech Icons -->                                                                                                    
        <g transform="translate(100, 120)">                                                                                            
          <!-- Python -->                                                                                                              
          <g transform="translate(0, 0)">                                                                                              
            <circle cx="0" cy="0" r="15" fill="#3776AB">                                                                               
              <animate attributeName="r" values="15;18;15" dur="2s" repeatCount="indefinite" />                                        
              <animate attributeName="fill" values="#3776AB;#00f5ff;#3776AB" dur="2s" repeatCount="indefinite" />                      
            </circle>                                                                                                                  
            <text x="0" y="5" font-family="Arial" font-size="12" fill="white" text-anchor="middle">Py</text>                           
          </g>                                                                                                                         
          <!-- PyTorch -->                                                                                                             
          <g transform="translate(60, 0)">                                                                                             
            <circle cx="0" cy="0" r="15" fill="#EE4C2C">                                                                               
              <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="3s" repeatCount="indefinite"    
      />                                                                                                                               
              <animate attributeName="fill" values="#EE4C2C;#ff00e6;#EE4C2C" dur="3s" repeatCount="indefinite" />                      
            </circle>                                                                                                                  
            <text x="0" y="5" font-family="Arial" font-size="10" fill="white" text-anchor="middle">PT</text>                           
          </g>                                                                                                                         
          <!-- Docker -->                                                                                                              
          <g transform="translate(120, 0)">                                                                                            
            <circle cx="0" cy="0" r="15" fill="#2496ED">                                                                               
              <animate attributeName="cx" values="0;8;0" dur="2s" repeatCount="indefinite" />                                          
              <animate attributeName="fill" values="#2496ED;#00f5ff;#2496ED" dur="2s" repeatCount="indefinite" />                      
            </circle>                                                                                                                  
            <text x="0" y="5" font-family="Arial" font-size="10" fill="white" text-anchor="middle">D</text>                            
          </g>                                                                                                                         
          <!-- TensorFlow -->                                                                                                          
          <g transform="translate(180, 0)">                                                                                            
            <circle cx="0" cy="0" r="15" fill="#FF6F00">                                                                               
              <animate attributeName="fill" values="#FF6F00;#ff00e6;#FF6F00" dur="2s" repeatCount="indefinite" />                      
            </circle>                                                                                                                  
            <text x="0" y="5" font-family="Arial" font-size="10" fill="white" text-anchor="middle">TF</text>                           
          </g>                                                                                                                         
        </g>                                                                                                                           
        <!-- Animated Subtitle -->                                                                                                     
        <text x="400" y="180" font-family="Arial" font-size="16" fill="#8b949e" text-anchor="middle">                                  
          <animate attributeName="opacity" values="0;1" dur="1.5s" begin="0.5s" fill="freeze" />                                       
          AI in Healthcare Researcher                                                                                                  
          <animate attributeName="fill" values="#8b949e;#00f5ff;#8b949e" dur="3s" repeatCount="indefinite" />                          
        </text>                                                                                                                        
        <!-- Floating Particles -->                                                                                                    
        <circle cx="200" cy="50" r="2" fill="#00f5ff">                                                                                 
          <animate attributeName="cy" values="50;70;50" dur="4s" repeatCount="indefinite" />                                           
          <animate attributeName="cx" values="200;210;200" dur="5s" repeatCount="indefinite" />                                        
        </circle>                                                                                                                      
        <circle cx="600" cy="30" r="2" fill="#ff00e6">                                                                                 
          <animate attributeName="cy" values="30;50;30" dur="5s" repeatCount="indefinite" />                                           
          <animate attributeName="cx" values="600;590;600" dur="4s" repeatCount="indefinite" />                                        
        </circle>                                                                                                                      
      </svg>                                                                                                                           
                        